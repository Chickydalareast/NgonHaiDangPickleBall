name: nhdp

x-logging: &default-logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-nhdp}:${POSTGRES_PASSWORD:-nhdp_local_password}@postgres:5432/${POSTGRES_DB:-nhdp}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}

services:
  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nhdp}
      POSTGRES_USER: ${POSTGRES_USER:-nhdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nhdp_local_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  api:
    image: nhdp-api
    build: *api-build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *database-environment
      SESSION_SECRET: ${SESSION_SECRET:-local-only-secret-change-me-32-characters-minimum}
      WEB_ORIGIN: http://localhost:${CADDY_HTTP_PORT:-8080}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    image: nhdp-api
    build: *api-build
    profiles: ['tools']
    restart: 'no'
    environment:
      NODE_ENV: production
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'apps/api/dist/db/migrate.js']
    logging: *default-logging

  seed:
    image: nhdp-api
    build: *api-build
    profiles: ['tools']
    restart: 'no'
    environment:
      NODE_ENV: production
      <<: *database-environment
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-change-this-local-admin-password}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'apps/api/dist/db/seed.js']
    logging: *default-logging

  caddy:
    image: nhdp-caddy
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

volumes:
  postgres_data:
